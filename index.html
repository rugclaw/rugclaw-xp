<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RugClaw XP Arena</title><style>body{font:16px system-ui;background:#10121b;color:#f7f7fa;max-width:720px;margin:40px auto;padding:18px}h1{color:#ffae43}p{color:#b6b8c4}article{background:#202433;border-radius:12px;margin:9px 0;padding:16px;display:flex;justify-content:space-between;gap:10px}strong{color:#ffcb79}small{color:#9ba2b5}</style><h1>🦞 RugClaw XP Arena</h1><p>Talk to RugClaw in Discord to earn XP. 1 XP per qualifying chat reply (once a minute), plus game rewards.</p><h2>🏆 Leaderboard</h2><div id="board">Loading…</div><p><small id="updated"></small></p><script>async function load(){try{const r=await fetch('leaderboard.json?t='+Date.now());if(!r.ok)throw Error();const d=await r.json();document.getElementById('board').replaceChildren(...(d.players.length?d.players.map((p,i)=>{const a=document.createElement('article');const n=document.createElement('span');n.textContent=(i+1)+'. '+p.name;const x=document.createElement('strong');x.textContent=p.xp+' XP · Lv '+p.level;a.append(n,x);return a}):[document.createTextNode('No XP earned yet. Be the first!')]));document.getElementById('updated').textContent='Last synced: '+new Date(d.updated*1000).toLocaleString()}catch(e){document.getElementById('board').textContent='Leaderboard temporarily unavailable.'}}load();setInterval(load,60000)</script></html>
